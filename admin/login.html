<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESSA Admin Login</title><link rel="stylesheet" href="../css/style.css"></head><body><section class="section"><div class="section-container" style="max-width:500px"><div class="section-heading"><span>ESSA ADMIN</span><h2>Login</h2><div class="heading-line"></div></div><form id="loginForm"><input id="username" placeholder="Username" required style="width:100%;padding:14px;margin-bottom:12px"><input id="password" type="password" placeholder="Password" required style="width:100%;padding:14px;margin-bottom:12px"><button class="btn btn-primary">Login</button></form><p id="msg" style="margin-top:15px"></p></div></section><script>
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();let r=await fetch("https://essa-hwxl.onrender.com/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});let d=await r.json();if(r.ok){localStorage.setItem("essa_token",d.access_token);location.href="dashboard.html"}else msg.textContent=d.detail||"Login failed"};
</script></body></html>
